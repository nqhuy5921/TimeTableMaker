appId: app.timetablemaker
productName: TimeTableMaker
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
asar: true
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: TimeTableMaker-Setup-${version}.${ext}
linux:
  target: dir
